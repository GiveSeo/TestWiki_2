name: Generate PDF from Wiki

on:
  schedule:
    - cron: '0 9 * * *'  # 매일 오전 9시에 실행 (UTC 기준, 한국은 +9시간 → 오후 6시)
  workflow_dispatch:       # 수동으로 실행 가능
  push:
    branches: [ main ]     # 메인 리포 수정 시에도 실행

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Clone Wiki repository
        run: |
          git clone https://github.com/GiveSeo/TestWiki_2.wiki.git wiki
          ls wiki

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra fonts-unfonts-core

      - name: Merge all wiki Markdown files
        run: |
          cd wiki
          echo "# GiveSeo Wiki Documentation" > combined.md
          find . -name "*.md" ! -name "combined.md" ! -path "./.git/*" -print0 | sort -z | xargs -0 cat >> combined.md
          cd ..

      - name: Generate PDF (with UnBatang font)
        run: |
          cd wiki
          pandoc combined.md \
            --pdf-engine=xelatex \
            -V mainfont="UnBatang" \
            -o combined.pdf
          cd ..

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-pdf
          path: wiki/combined.pdf

      - name: Commit PDF back to main repo
        run: |
          mv wiki/combined.pdf Wiki_전체.pdf
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Wiki_전체.pdf
          git commit -m "📄 Update Wiki PDF from .wiki.git" || echo "No changes to commit"
          git push
