name: Generate PDF from Wiki and Update Home Link

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      update_wiki_link:
        description: 'Wiki Home.md에 PDF 링크 업데이트'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      pdf_font_size:
        description: 'PDF 폰트 크기 (pt)'
        required: false
        default: '11'
        type: choice
        options:
          - '10'
          - '11'
          - '12'
  push:
    branches:
      - master

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Clone Wiki repository with PAT
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/GiveSeo/TestWiki_2.wiki.git wiki
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-cjk \
            fonts-unfonts-core \
            librsvg2-bin \
            imagemagick

      - name: Merge all Wiki Markdown files and download images
        run: |
          cd wiki
          
          echo "# GiveSeo Wiki Documentation" > combined.md
          echo "" >> combined.md
          echo "---" >> combined.md
          echo "" >> combined.md
          
          # 이미지 디렉토리 생성
          mkdir -p downloaded_images
          
          # 모든 Markdown 파일 병합 및 이미지 URL 추출
          find . -name "*.md" ! -name "combined.md" ! -path "./.git/*" -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "" >> combined.md
            echo "---" >> combined.md
            echo "" >> combined.md
            cat "$file" >> combined.md
          done
          
          # HTTP/HTTPS 이미지 URL 추출 및 다운로드
          echo "📥 외부 이미지 다운로드 중..."
          grep -oP '!\[.*?\]\(\K(https?://[^)]+)' combined.md | sort -u | while read -r url; do
            filename=$(echo "$url" | md5sum | cut -d' ' -f1)
            extension="${url##*.}"
            # 확장자가 너무 길면 기본값 사용
            if [ ${#extension} -gt 4 ]; then
              extension="jpg"
            fi
            
            echo "  다운로드: $url -> downloaded_images/${filename}.${extension}"
            curl -L -s --max-time 10 "$url" -o "downloaded_images/${filename}.${extension}" || echo "    ⚠️ 다운로드 실패: $url"
            
            # Markdown에서 URL을 로컬 경로로 변경
            if [ -f "downloaded_images/${filename}.${extension}" ]; then
              sed -i "s|$url|downloaded_images/${filename}.${extension}|g" combined.md
            fi
          done
          
          echo "✅ Markdown 병합 및 이미지 다운로드 완료"
          echo "📊 다운로드된 이미지 수: $(ls -1 downloaded_images 2>/dev/null | wc -l)"

      - name: Generate PDF
        run: |
          cd wiki
          
          FONT_SIZE="${{ github.event.inputs.pdf_font_size || '11' }}"
          
          echo "📄 PDF 생성 중... (폰트 크기: ${FONT_SIZE}pt)"
          
          pandoc combined.md \
            --pdf-engine=xelatex \
            -V mainfont="UnBatang" \
            -V sansfont="UnBatang" \
            -V monofont="UnBatang" \
            -V fontsize=${FONT_SIZE}pt \
            -V geometry:margin=2cm \
            -V geometry:a4paper \
            -V linestretch=1.3 \
            -V urlcolor=blue \
            -V linkcolor=blue \
            --wrap=auto \
            --highlight-style=tango \
            --toc \
            --toc-depth=3 \
            -V block-headings \
            -o combined.pdf 2>&1 | tee pandoc.log
          
          if [ -f combined.pdf ]; then
            echo "✅ PDF 생성 완료!"
            echo "📊 PDF 크기: $(du -h combined.pdf)"
          else
            echo "❌ PDF 생성 실패!"
            echo "⚠️ Pandoc 로그:"
            cat pandoc.log
            exit 1
          fi

      - name: Commit PDF to main repository
        run: |
          mv wiki/combined.pdf Wiki_전체.pdf
          
          if [ ! -f "Wiki_전체.pdf" ]; then
            echo "❌ PDF 파일이 생성되지 않았습니다!"
            exit 1
          fi
          
          echo "✅ PDF 파일 크기: $(du -h Wiki_전체.pdf)"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/GiveSeo/TestWiki_2.git
          
          git add Wiki_전체.pdf
          
          if git diff --staged --quiet; then
            echo "📝 변경사항 없음"
          else
            git commit -m "📄 Update Wiki PDF"
            echo "🚀 Pushing to repository..."
            git push origin HEAD
            echo "✅ Push 완료!"
          fi

      - name: Update Home.md in Wiki with PDF link
        if: ${{ github.event.inputs.update_wiki_link != 'false' }}
        run: |
          cd wiki
          
          PDF_URL_RAW="https://github.com/GiveSeo/TestWiki_2/raw/master/Wiki_전체.pdf"
          PDF_URL_BLOB="https://github.com/GiveSeo/TestWiki_2/blob/master/Wiki_전체.pdf"
          
          HOME_FILE="Home.md"
          
          echo "📝 생성할 링크들:"
          echo "  - Raw: ${PDF_URL_RAW}"
          echo "  - Blob: ${PDF_URL_BLOB}"
          
          if grep -q "## 📘 PDF 다운로드" "$HOME_FILE"; then
            echo "🔄 기존 PDF 섹션 제거"
            sed -i '/## 📘 PDF 다운로드/,/^## /{ /^## 📘 PDF 다운로드/d; /^## /!d; }' "$HOME_FILE"
          fi
          
          echo "" >> "$HOME_FILE"
          echo "## 📘 PDF 다운로드" >> "$HOME_FILE"
          echo "" >> "$HOME_FILE"
          echo "전체 Wiki를 PDF로 다운로드할 수 있습니다:" >> "$HOME_FILE"
          echo "" >> "$HOME_FILE"
          echo "- [📥 PDF 다운로드 (Raw)]($PDF_URL_RAW)" >> "$HOME_FILE"
          echo "- [👁️ GitHub에서 보기]($PDF_URL_BLOB)" >> "$HOME_FILE"
          
          cat "$HOME_FILE"
          
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/GiveSeo/TestWiki_2.wiki.git
          
          git add "$HOME_FILE"
          if git diff --staged --quiet; then
            echo "📝 변경사항 없음"
          else
            git commit -m "🔗 Update PDF download link"
            echo "🚀 Pushing to Wiki..."
            git push origin HEAD:master
            echo "✅ Wiki 업데이트 완료!"
          fi

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-pdf
          path: Wiki_전체.pdf
