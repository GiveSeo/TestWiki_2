name: Generate PDF from Wiki and Update Home Link

on:
  schedule:
    - cron: '0 9 * * *'  # 매일 오전 9시 (UTC 기준, 한국 오후 6시)
  workflow_dispatch:       # 수동 실행 가능
  push:
    branches: [ main ]     # 메인 브랜치 업데이트 시 실행

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Clone Wiki repository
        run: |
          git clone https://github.com/GiveSeo/TestWiki_2.wiki.git wiki
          ls wiki

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            fonts-unfonts-core
          fc-list :lang=ko || echo "No Korean fonts found"

      - name: Merge all Wiki Markdown files
        run: |
          cd wiki
          echo "# GiveSeo Wiki Documentation" > combined.md
          find . -name "*.md" ! -name "combined.md" ! -path "./.git/*" -print0 | sort -z | xargs -0 cat >> combined.md
          cd ..

      - name: Generate PDF (UnBatang for all fonts, including code)
        run: |
          cd wiki
          pandoc combined.md \
            --pdf-engine=xelatex \
            -V mainfont="UnBatang" \
            -V sansfont="UnBatang" \
            -V monofont="UnBatang" \
            -V fontsize=12pt \
            -o combined.pdf
          cd ..

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-pdf
          path: wiki/combined.pdf

      - name: Commit PDF to main repository
        run: |
          mv wiki/combined.pdf Wiki_전체.pdf
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Wiki_전체.pdf
          git commit -m "📄 Update Wiki PDF from .wiki.git" || echo "No changes to commit"
          git push

      - name: Update Home.md in Wiki with PDF link
        run: |
          cd wiki
          PDF_URL="https://github.com/GiveSeo/TestWiki_2/raw/main/Wiki_전체.pdf"
          LINK_LINE="[📎 최신 Wiki PDF 다운로드](${PDF_URL})"
          HOME_FILE="Home.md"

          if grep -q "📎 최신 Wiki PDF 다운로드" "$HOME_FILE"; then
            # 기존 링크 업데이트
            sed -i "s|\\[📎 최신 Wiki PDF 다운로드\\](.*)|${LINK_LINE}|" "$HOME_FILE"
          else
            # 링크가 없으면 파일 맨 아래 추가
            echo "" >> "$HOME_FILE"
            echo "## 📘 PDF 다운로드" >> "$HOME_FILE"
            echo "${LINK_LINE}" >> "$HOME_FILE"
          fi

          git add "$HOME_FILE"
          git commit -m "🔗 Update PDF download link in Home.md" || echo "No changes to commit"
          git push
