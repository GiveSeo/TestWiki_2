name: Generate PDF from Wiki and Update Home Link

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      update_wiki_link:
        description: 'Wiki Home.md에 PDF 링크 업데이트'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      pdf_font_size:
        description: 'PDF 폰트 크기 (pt)'
        required: false
        default: '11'
        type: choice
        options:
          - '10'
          - '11'
          - '12'
  push:
    branches:
      - master

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Clone Wiki repository with PAT
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/GiveSeo/TestWiki_2.wiki.git wiki
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-lang-cjk texlive-latex-extra fonts-unfonts-core fonts-nanum librsvg2-bin imagemagick
          wget -q https://github.com/naver/d2codingfont/releases/download/VER1.3.2/D2Coding-Ver1.3.2-20180524.zip
          unzip -q D2Coding-Ver1.3.2-20180524.zip
          sudo mkdir -p /usr/share/fonts/truetype/d2coding
          sudo cp D2Coding/*.ttf /usr/share/fonts/truetype/d2coding/
          sudo fc-cache -fv

      - name: Merge all Wiki Markdown files and download images
        run: |
          cd wiki
          echo "# GiveSeo Wiki Documentation" > combined.md
          echo "" >> combined.md
          echo "---" >> combined.md
          echo "" >> combined.md
          mkdir -p downloaded_images
          find . -name "*.md" ! -name "combined.md" ! -path "./.git/*" -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "" >> combined.md
            echo "---" >> combined.md
            echo "" >> combined.md
            cat "$file" >> combined.md
          done
          echo "📥 외부 이미지 다운로드 중..."
          grep -oP '!\[.*?\]\(\K(https?://[^)]+)' combined.md | sort -u | while read -r url; do
            filename=$(echo "$url" | md5sum | cut -d' ' -f1)
            extension="${url##*.}"
            if [ ${#extension} -gt 4 ]; then
              extension="jpg"
            fi
            echo "  다운로드: $url"
            curl -L -s --max-time 10 "$url" -o "downloaded_images/${filename}.${extension}" || echo "    ⚠️ 실패"
            if [ -f "downloaded_images/${filename}.${extension}" ]; then
              sed -i "s|$url|downloaded_images/${filename}.${extension}|g" combined.md
            fi
          done
          echo "✅ Markdown 병합 완료"

      - name: Generate PDF
        run: |
          cd wiki
          FONT_SIZE="${{ github.event.inputs.pdf_font_size || '11' }}"
          echo "📄 PDF 생성 중... (폰트 크기: ${FONT_SIZE}pt)"
          cat > header.tex << 'EOF'
          \usepackage{fvextra}
          \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,breakanywhere,commandchars=\\\{\}}
          \usepackage{xcolor}
          \usepackage{longtable}
          \usepackage{booktabs}
          \setlength{\emergencystretch}{3em}
          \providecommand{\tightlist}{\setlength{\itemsep}{0pt}\setlength{\parskip}{0pt}}
          EOF
          pandoc combined.md --pdf-engine=xelatex -V mainfont="UnBatang" -V sansfont="UnBatang" -V monofont="D2Coding" -V CJKmainfont="UnBatang" -V fontsize=${FONT_SIZE}pt -V geometry:margin=1.5cm -V geometry:a4paper -V linestretch=1.2 -V urlcolor=blue -V linkcolor=blue -V colorlinks=true --wrap=preserve --highlight-style=tango --toc --toc-depth=3 -V block-headings -H header.tex --listings -o combined.pdf 2>&1 | tee pandoc.log
          if [ -f combined.pdf ]; then
            echo "✅ PDF 생성 완료! 크기: $(du -h combined.pdf)"
          else
            echo "❌ PDF 생성 실패!"
            cat pandoc.log
            exit 1
          fi

      - name: Commit PDF to main repository
        run: |
          mv wiki/combined.pdf Wiki_전체.pdf
          if [ ! -f "Wiki_전체.pdf" ]; then
            echo "❌ PDF 파일이 없습니다!"
            exit 1
          fi
          echo "✅ PDF 파일 크기: $(du -h Wiki_전체.pdf)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/GiveSeo/TestWiki_2.git
          echo "🔄 원격 저장소 동기화..."
          git fetch origin
          git pull origin HEAD --rebase || {
            echo "⚠️ Rebase 충돌, PDF 우선 적용"
            git checkout --ours Wiki_전체.pdf 2>/dev/null || true
            git add Wiki_전체.pdf
            git rebase --continue || true
          }
          git add Wiki_전체.pdf
          if git diff --staged --quiet; then
            echo "📝 변경사항 없음"
          else
            git commit -m "📄 Update Wiki PDF"
            echo "🚀 Pushing..."
            git push origin HEAD
            echo "✅ Push 완료!"
          fi

      - name: Update Home.md in Wiki with PDF link
        if: ${{ github.event.inputs.update_wiki_link != 'false' }}
        run: |
          cd wiki
          PDF_URL_RAW="https://github.com/GiveSeo/TestWiki_2/raw/master/Wiki_전체.pdf"
          PDF_URL_BLOB="https://github.com/GiveSeo/TestWiki_2/blob/master/Wiki_전체.pdf"
          HOME_FILE="Home.md"
          echo "📝 PDF 링크 업데이트"
          if grep -q "## 📘 PDF 다운로드" "$HOME_FILE"; then
            sed -i '/## 📘 PDF 다운로드/,/^## /{ /^## 📘 PDF 다운로드/d; /^## /!d; }' "$HOME_FILE"
          fi
          echo "" >> "$HOME_FILE"
          echo "## 📘 PDF 다운로드" >> "$HOME_FILE"
          echo "" >> "$HOME_FILE"
          echo "전체 Wiki를 PDF로 다운로드할 수 있습니다:" >> "$HOME_FILE"
          echo "" >> "$HOME_FILE"
          echo "- [📥 PDF 다운로드 (Raw)]($PDF_URL_RAW)" >> "$HOME_FILE"
          echo "- [👁️ GitHub에서 보기]($PDF_URL_BLOB)" >> "$HOME_FILE"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/GiveSeo/TestWiki_2.wiki.git
          git add "$HOME_FILE"
          if git diff --staged --quiet; then
            echo "📝 변경사항 없음"
          else
            git commit -m "🔗 Update PDF download link"
            git push origin HEAD:master
            echo "✅ Wiki 업데이트 완료!"
          fi

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-pdf
          path: Wiki_전체.pdf
