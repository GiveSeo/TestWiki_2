name: Generate Wiki PDF

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-pdf.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Wiki repository
        run: |
          git clone https://github.com/${{ github.repository }}.wiki.git wiki

      - name: Combine all Markdown files
        run: |
          cd wiki
          rm -f combined.md
          find . -type f -name "*.md" ! -name "combined.md" -print0 | sort -z | xargs -0 cat >> combined.md

      - name: Install dependencies and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-korean fonts-unfonts-core fonts-d2coding

      - name: Generate PDF
        run: |
          cd wiki
          pandoc combined.md \
            -o output.pdf \
            --pdf-engine=xelatex \
            -V mainfont="UnBatang" \
            -V monofont="D2Coding" \
            -V geometry:margin=1in

      - name: Move PDF to main repo
        run: |
          mv wiki/output.pdf wiki.pdf

      - name: Commit and push generated PDF to main branch
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add wiki.pdf
          git commit -m "Auto update Wiki PDF [skip ci]" || echo "No changes to commit"
          git push

      - name: Print final link
        run: |
          echo "✅ Wiki PDF generated: https://github.com/${{ github.repository }}/blob/main/wiki.pdf"
