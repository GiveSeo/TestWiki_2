name: Convert Wiki to PDF

on:
  workflow_dispatch: # 수동 실행
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: GiveSeo/TestWiki_2.wiki
          path: wiki

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive texlive-xetex texlive-fonts-recommended texlive-lang-korean

      - name: Combine all Markdown files
        run: |
          cd wiki
          ls -l
          cat *.md > combined.md

      - name: Convert combined.md to PDF (with Korean font)
        run: |
          cd wiki
          pandoc combined.md -o wiki.pdf --pdf-engine=xelatex \
            -V mainfont="NanumGothic" \
            --resource-path=.:./images

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-pdf
          path: wiki/wiki.pdf
