name: Sync Markdown to Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"   # ✅ docs 폴더 안의 md 수정 시 작동 (필요에 따라 수정 가능)
      - "README.md"

jobs:
  sync-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Clone wiki repo
        run: |
          git clone "https://github.com/${{ github.repository }}.wiki.git" wiki

      - name: Copy markdown files to wiki
        run: |
          mkdir -p wiki/docs
          cp -r docs/*.md wiki/docs/ || true
          cp README.md wiki/ || true

      - name: Add download links to Wiki Home.md
        run: |
          HOME_FILE="wiki/Home.md"
          echo "## 📦 Downloads" > temp_home.md
          for f in $(ls wiki/docs/*.md 2>/dev/null); do
            fname=$(basename "$f")
            echo "- [${fname%.*}](docs/$fname)" >> temp_home.md
          done
          echo "" >> temp_home.md
          echo "---" >> temp_home.md
          cat "$HOME_FILE" >> temp_home.md || true
          mv temp_home.md "$HOME_FILE"

      - name: Commit & Push to Wiki
        run: |
          cd wiki
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Sync Wiki from main repo"
            git push "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" HEAD:master
          fi
