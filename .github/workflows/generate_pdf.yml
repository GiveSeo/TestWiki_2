name: Wiki to PDF

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**' # wiki 폴더가 바뀔 때마다 실행
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex fonts-unfonts-core

      - name: Combine all wiki files
        working-directory: wiki
        run: |
          rm -f combined.md
          for file in *.md; do
            echo "\n\n---\n\n" >> combined.md
            cat "$file" >> combined.md
          done

      - name: Convert to PDF (UTF-8 + font fix)
        working-directory: wiki
        run: |
          pandoc combined.md \
            -o Wiki_All.pdf \
            --pdf-engine=xelatex \
            -V mainfont="UnBatang" \
            -V geometry:margin=1in \
            -V linkcolor=blue \
            --resource-path=.

      - name: Add PDF link to Home.md
        working-directory: wiki
        run: |
          if grep -q "Wiki_All.pdf" Home.md; then
            echo "PDF link already exists in Home.md"
          else
            echo -e "\n\n📄 **[Download Full Wiki as PDF](./Wiki_All.pdf)**" >> Home.md
          fi

      - name: Commit and push PDF & updated Home.md
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add wiki/Wiki_All.pdf wiki/Home.md
          git commit -m "Auto update Wiki PDF"
          git push
